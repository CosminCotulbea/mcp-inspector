upstream mcp_inspector {
    server mcp-inspector-app:6274;
}

# Only send `Connection: upgrade` when the client actually asks to upgrade, so plain
# requests and event streams keep a normal keep-alive connection.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name _;

    # nginx-proxy publishes 443 on every interface and, under Docker Desktop, every client
    # reaches it from the same gateway IP, so an IP allow-list cannot tell this machine
    # from the LAN. A password can.
    auth_basic "MCP Inspector";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://mcp_inspector;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Server-sent events: buffering would hold them back until the buffer fills.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
