services:
    # Front door: the only container on the nginx-proxy network. Adds Basic Auth and turns
    # off response buffering so the Inspector's event streams arrive as they happen.
    mcp-inspector-nginx:
        container_name: mcp-inspector-nginx
        image: nginx:${NGINX_VERSION}
        restart: unless-stopped
        volumes:
            - ./nginx/custom.conf:/etc/nginx/conf.d/custom.conf:ro
            # Generated by start.sh from MCP_INSPECTOR_UI_USERNAME / _PASSWORD.
            - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
        depends_on:
            - mcp-inspector-app
        environment:
            VIRTUAL_HOST: ${DOMAIN_HOST}
            SELF_SIGNED_HOST: ${SELF_SIGNED_HOST}
            VIRTUAL_PORT: 80
        labels:
            - com.github.nginx-proxy.nginx-proxy.ssl_verify_client=off
        networks:
            - nginx-proxy
            - mcp-inspector

    mcp-inspector-app:
        container_name: mcp-inspector-app
        image: ghcr.io/modelcontextprotocol/inspector:${MCP_INSPECTOR_VERSION}
        restart: unless-stopped
        # Owns the bind-mounted data/ directory on the host.
        user: ${USER_ID}:${GROUP_ID}
        volumes:
            # Server catalog (mcp.json) and the encrypted secret store, kept across restarts.
            - ../data:/home/node/.mcp-inspector
            # Only the proxy's CA, never the whole certs directory (every project's keys).
            - ${NGINX_PROXY_PATH}/certs/nginx-proxy-ca.crt:/etc/ssl/certs/local-proxy-ca.crt:ro
            - ./.secret-key:/run/secrets/mcp_inspector_secret_key:ro
        environment:
            NODE_EXTRA_CA_CERTS: /etc/ssl/certs/local-proxy-ca.crt
            # The UI is served from https://DOMAIN_HOST, not the localhost:6274 the
            # Inspector derives its allow-list from.
            ALLOWED_ORIGINS: https://${DOMAIN_HOST}
            MCP_INSPECTOR_API_TOKEN: ${MCP_INSPECTOR_API_TOKEN:-}
            MCP_INSPECTOR_SECRET_STORE: file
            MCP_INSPECTOR_SECRET_KEY_FILE: /run/secrets/mcp_inspector_secret_key
        # extra_hosts for the MCP servers' `.local` names come from MCP_SERVER_HOSTS in .env,
        # via docker-compose.hosts.yml that prepare.sh generates — this file names no server.
        # No published port, and not on the nginx-proxy network: reachable only through
        # mcp-inspector-nginx.
        networks:
            - mcp-inspector

networks:
    mcp-inspector:
    nginx-proxy:
        external: true
